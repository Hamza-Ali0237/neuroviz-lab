[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "neuroviz-lab"
version = "0.1.1"
description = "See inside the model: run small ML models step by step and watch the forward pass, loss, backward pass and update as interactive 2D and 3D views."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Humza Ali" }]
keywords = [
  "machine-learning",
  "deep-learning",
  "visualization",
  "education",
  "teaching",
  "numpy",
  "autograd",
  "neural-network",
  "transformer",
  "cnn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Education",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "jsonschema>=4.18",
  "scikit-learn>=1.3",
  "build>=1.0",
  "twine>=5",
]

[project.scripts]
nvzlab = "nvzlab.cli:main"

[project.urls]
Homepage = "https://github.com/Hamza-Ali0237/neuroviz-lab"
Repository = "https://github.com/Hamza-Ali0237/neuroviz-lab"
Issues = "https://github.com/Hamza-Ali0237/neuroviz-lab/issues"
Changelog = "https://github.com/Hamza-Ali0237/neuroviz-lab/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Hamza-Ali0237/neuroviz-lab/blob/main/ROADMAP.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nvzlab"]
artifacts = ["src/nvzlab/viewer/static/*", "src/nvzlab/weights/*.npz"]

[tool.hatch.build.targets.sdist]
include = [
  "src/nvzlab",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/ROADMAP.md",
  "examples",
  "scripts",
  "tests",
  "frontend/src",
  "frontend/index.html",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/tsconfig.json",
  "frontend/vite.config.ts",
]
exclude = ["/.gitignore", "**/__pycache__", "**/.DS_Store", "*.png", "*.gif", "*.mp4", "*.frames"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
